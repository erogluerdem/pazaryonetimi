services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pazaryonetimi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pazaryonetimi_secret}
      POSTGRES_DB: pazaryonetimi
    ports:
      - "5432:5432"
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pazaryonetimi"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: pazaryonetimi-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        - DATABASE_URL=${DATABASE_URL:-postgresql://pazaryonetimi:pazaryonetimi_secret@postgres:5432/pazaryonetimi}
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://pazaryonetimi:pazaryonetimi_secret@postgres:5432/pazaryonetimi}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-${GEMINI_API_KEY}}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - WEB_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - AMAZON_SP_API_APPLICATION_ID=${AMAZON_SP_API_APPLICATION_ID}
      - AMAZON_CLIENT_ID=${AMAZON_CLIENT_ID}
      - AMAZON_CLIENT_SECRET=${AMAZON_CLIENT_SECRET}
      - AMAZON_REDIRECT_URI=${AMAZON_REDIRECT_URI}
      - HEPSIBURADA_INTEGRATOR_NAME=${HEPSIBURADA_INTEGRATOR_NAME:-PazarYonetimi}
      - TRENDYOL_INTEGRATOR_NAME=${TRENDYOL_INTEGRATOR_NAME:-PazarYonetimi}
      - XML_AUTO_SYNC_ENABLED=${XML_AUTO_SYNC_ENABLED:-true}
      - DATA_OPERATIONS_WORKER_ENABLED=${DATA_OPERATIONS_WORKER_ENABLED:-true}
      - BACKUP_WORKER_ENABLED=${BACKUP_WORKER_ENABLED:-true}
      - BACKUP_STORAGE_DIR=/app/var/backups
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY:-${ENCRYPTION_KEY}}
      - RESTORE_DRILL_ADMIN_URL=${RESTORE_DRILL_ADMIN_URL}
      - ALLOW_SIMULATED_PAYMENTS=${ALLOW_SIMULATED_PAYMENTS:-false}
      - ALLOW_SIMULATED_SHIPPING=${ALLOW_SIMULATED_SHIPPING:-false}
      - NODE_ENV=production
    volumes:
      - backup_data:/app/var/backups
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always

  web:
    image: pazaryonetimi-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - DATABASE_URL=${DATABASE_URL:-postgresql://pazaryonetimi:pazaryonetimi_secret@postgres:5432/pazaryonetimi}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://api:3001}
        - NEXTAUTH_URL=${NEXTAUTH_URL:-https://pazaryonetimi.com}
        - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://pazaryonetimi:pazaryonetimi_secret@postgres:5432/pazaryonetimi}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      - API_INTERNAL_URL=${API_INTERNAL_URL:-http://api:3001}
      - API_URL=${API_INTERNAL_URL:-http://api:3001}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-pazaryonetimi_secret_session_key_32_characters_long_2026}
      - AUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_SECRET=${NEXTAUTH_SECRET:-${AUTH_SECRET:-pazaryonetimi_secret_session_key_32_characters_long_2026}}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-${GEMINI_API_KEY}}
      - GOOGLE_GEMINI_API_KEY=${GOOGLE_GEMINI_API_KEY:-${GEMINI_API_KEY}}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
    ports:
      - "3000:3000"
    depends_on:
      - api
      - redis
    restart: always

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    image: pazaryonetimi-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["sh", "-c", "cd apps/api && node dist/apps/api/src/worker.js"]
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://pazaryonetimi:pazaryonetimi_secret@postgres:5432/pazaryonetimi}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ENABLE_SCHEDULER=true
      - ALLOW_SIMULATED_PAYMENTS=${ALLOW_SIMULATED_PAYMENTS:-false}
      - ALLOW_SIMULATED_SHIPPING=${ALLOW_SIMULATED_SHIPPING:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

volumes:
  backup_data:
  postgres_data:
